<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">PEOPLE OPERATIONS</p>
        <h1>Employee Management</h1>
        <p class="subtitle">Add, view and manage your team members.</p>
      </div>
      <span class="status"><span></span> API dashboard</span>
    </header>

    <section class="panel">
      <h2 id="form-title">Add an employee</h2>
      <form id="employee-form">
        <input type="hidden" id="employee-id">
        <div class="fields">
          <label>Full name<input id="name" required placeholder="e.g. Priya Sharma"></label>
          <label>Email address<input id="email" type="email" required placeholder="priya@example.com"></label>
          <label>Department<input id="department" required placeholder="e.g. Engineering"></label>
          <label>Job role<input id="role" required placeholder="e.g. Software Engineer"></label>
        </div>
        <div class="actions">
          <button type="submit" id="submit-button">Add employee</button>
          <button type="button" id="cancel-button" class="secondary hidden">Cancel edit</button>
        </div>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="panel">
      <div class="list-heading">
        <div><h2>Team members</h2><p class="subtitle">Employee records stored in MongoDB</p></div>
        <button id="refresh-button" class="secondary" type="button">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Actions</th></tr></thead>
          <tbody id="employee-list"><tr><td colspan="5">Loading employees...</td></tr></tbody>
        </table>
      </div>
    </section>
    <footer>Employee Management System · Node.js + Express + MongoDB</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
